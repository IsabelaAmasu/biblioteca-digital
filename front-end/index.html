<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Biblioteca Digital</h1>
    </header>

    <main class="container">
        <section class="card">
            <h2>Gerenciar Acervo (Adicionar Livro)</h2>
            <form id="livro-form">
                <input type="hidden" id="livro-id">
                <div class="form-group">
                    <input type="text" id="titulo" placeholder="Título do Livro" required>
                    <input type="text" id="autor" placeholder="Autor" required>
                    <input type="number" id="ano" placeholder="Ano de Publicação" required>
                </div>
                <button type="submit" id="btn-salvar">Salvar Livro</button>
            </form>
        </section>

        <section class="search-container">
            <input type="text" id="busca" placeholder="Pesquisar livro por título..." oninput="buscarLivros()">
        </section>

        <section class="card">
            <h2>Livros Disponíveis</h2>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Ano</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="livros-lista">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
